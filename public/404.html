<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian Crest AI — Redirecting</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var base = path.replace(/\/[^/]*$/, '/');
        var hash = window.location.hash || '#/hub';
        window.location.replace(base + hash);
      })();
    </script>
  </head>
  <body>
    <p style="font-family: system-ui, sans-serif; color: #334155; padding: 2rem;">
      Redirecting to Meridian Crest AI workspace...
    </p>
  </body>
</html>
